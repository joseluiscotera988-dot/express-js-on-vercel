<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pase Y Mire - Ecosistema P&M</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/variables.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-24 min-h-screen">

  <header class="bg-slate-950 p-4 sticky top-0 z-40 border-b border-slate-800">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <h1 class="text-lg font-bold tracking-wider text-amber-400">PASE Y MIRE</h1>
      <div id="user-badge" class="bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-xs text-slate-200">
        Ecosistema Activo 🟢
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl text-center">
      <span class="text-3xl">⚡</span>
      <h2 class="text-lg font-bold text-white mt-2">Arquitectura Modular P&M</h2>
      <p class="text-xs text-slate-400 mt-1">El sistema nervioso y la cuenta maestra están operativos.</p>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
