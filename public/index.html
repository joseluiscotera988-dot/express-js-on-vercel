<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EscrowGuard - Sistema KYC, Logística y Pagos MP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SDK MERCADO PAGO -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <!-- NAVBAR -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🛡️</span>
        <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-500 bg-clip-text text-transparent">EscrowGuard Checkout</span>
      </div>
      <div id="nav-guest" class="flex items-center gap-3">
        <button onclick="showAuthView('login')" class="px-4 py-2 text-sm font-medium hover:text-emerald-400 transition">Iniciar Sesión</button>
        <button onclick="showAuthView('register')" class="px-4 py-2 text-sm font-semibold bg-emerald-500 hover:bg-emerald-600 text-slate-950 rounded-lg transition">Registrarse</button>
      </div>
      <div id="nav-user" class="hidden flex items-center gap-4">
        <span id="user-display" class="text-xs font-mono text-emerald-400"></span>
        <button onclick="handleLogout()" class="px-3 py-1.5 text-xs bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition">Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <!-- VISTA DE AUTENTICACIÓN -->
  <main id="view-auth" class="max-w-xl mx-auto my-8 px-4 w-full">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
      <div class="flex border-b border-slate-800 mb-6">
        <button id="tab-login-btn" onclick="showAuthView('login')" class="w-1/2 py-3 text-center font-bold border-b-2 border-emerald-500 text-emerald-400">Iniciar Sesión</button>
        <button id="tab-register-btn" onclick="showAuthView('register')" class="w-1/2 py-3 text-center font-bold text-slate-500 border-b-2 border-transparent">Registro KYC</button>
      </div>

      <!-- LOGIN -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Correo Electrónico</label>
          <input type="email" id="login-email" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-white focus:outline-none" required />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="login-password" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-white focus:outline-none" required />
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-3 rounded-lg transition">Ingresar</button>
      </form>

      <!-- REGISTRO KYC -->
      <form id="form-register" onsubmit="handleRegister(event)" class="hidden space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <input type="text" id="reg-nombre" placeholder="Nombre" class="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white" required />
          <input type="text" id="reg-apellido" placeholder="Apellido" class="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white" required />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <input type="text" id="reg-dni" placeholder="DNI" class="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white" required />
          <input type="tel" id="reg-telefono" placeholder="Teléfono" class="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white" required />
        </div>
        <input type="text" id="reg-direccion" placeholder="Dirección Legal" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white" required />
        <select id="reg-rol" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white">
          <option value="cliente">Comprador / Vendedor</option>
          <option value="chofer_flete">Conductor Fletes / Mudanzas</option>
          <option value="chofer_remis">Conductor Remis / Traslados</option>
          <option value="mensajero">Mensajería Urbana (Moto)</option>
        </select>
        <input type="email" id="reg-email" placeholder="Email" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white" required />
        <input type="password" id="reg-password" placeholder="Contraseña" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-sm text-white" required />
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-3 rounded-lg transition">Crear Cuenta</button>
      </form>

      <div id="auth-msg" class="hidden mt-4 p-3 rounded-lg text-xs text-center"></div>
    </div>
  </main>

  <!-- DASHBOARD PRINCIPAL -->
  <main id="view-dashboard" class="hidden max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
    
    <!-- HEADER PERFIL -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 id="profile-name" class="text-xl font-bold text-white">Cargando...</h2>
        <p id="profile-details" class="text-xs text-slate-400 mt-1"></p>
      </div>
    </div>

    <!-- MÓDULO LOGÍSTICA & PAGO CON MERCADO PAGO -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <div class="lg:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <h3 class="text-base font-bold text-emerald-400 mb-4 flex items-center gap-2">
          <span>💳</span> Cotizar y Pagar con Mercado Pago
        </h3>
        <form onsubmit="handleCreateOrderAndPay(event)" class="space-y-3">
          <input type="text" id="order-title" placeholder="Producto / Servicio" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" required />
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="order-price" oninput="recalculate()" placeholder="Precio ($)" class="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" required />
            <input type="number" id="order-ship-cost" oninput="recalculate()" placeholder="Envío ($)" class="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" required />
          </div>
          <select id="order-ship-type" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white">
            <option value="mensajeria">🛵 Mensajería Urbana (Moto)</option>
            <option value="remis">🚗 Remis / Traslado Directo</option>
            <option value="flete">🚚 Flete & Mudanza (Carga)</option>
            <option value="larga_distancia">🚛 Larga Distancia</option>
          </select>
          <input type="text" id="order-origin" placeholder="Dirección Retiro" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" required />
          <input type="text" id="order-destination" placeholder="Dirección Entrega" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" required />

          <div class="p-3 bg-slate-950/60 rounded-lg text-xs space-y-1 text-slate-400">
            <div class="flex justify-between"><span>Comisión Escrow (3%):</span><span id="calc-fee" class="text-emerald-400 font-mono">$0.00</span></div>
            <div class="flex justify-between font-bold text-white pt-1 border-t border-slate-800"><span>Total a Depositar:</span><span id="calc-total" class="font-mono text-emerald-400">$0.00</span></div>
          </div>

          <button type="submit" id="pay-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg text-xs flex items-center justify-center gap-2 transition">
            <span>🔵</span> Pagar y Congelar Fondos en MP
          </button>
        </form>
      </div>

      <!-- TABLA DE ÓRDENES Y LIBERACIÓN POR PIN -->
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <h3 class="text-base font-bold text-white mb-4">Órdenes en Custodia MP</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950 text-slate-400 uppercase">
              <tr>
                <th class="p-3">Detalle</th>
                <th class="p-3">Monto Total</th>
                <th class="p-3">PIN Entrega</th>
                <th class="p-3">Estado</th>
                <th class="p-3 text-right">Acción</th>
              </tr>
            </thead>
            <tbody id="orders-list" class="divide-y divide-slate-800">
              <tr><td colspan="5" class="p-4 text-center text-slate-500">Cargando órdenes...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    let supabaseClient = null;
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.supabaseUrl && config.supabaseKey) {
          supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseKey);
          
          const { data: { session } } = await supabaseClient.auth.getSession();
          handleAuthChange(session);

          supabaseClient.auth.onAuthStateChange((_e, session) => handleAuthChange(session));
        }
      } catch (e) {
        console.error("Error Supabase:", e);
      }
    });

    function handleAuthChange(session) {
      if (session) {
        currentUser = session.user;
        document.getElementById('view-auth').classList.add('hidden');
        document.getElementById('view-dashboard').classList.remove('hidden');
        document.getElementById('nav-guest').classList.add('hidden');
        document.getElementById('nav-user').classList.remove('hidden');
        document.getElementById('user-display').innerText = currentUser.email;
        loadProfile();
        loadOrders();
      } else {
        currentUser = null;
        document.getElementById('view-auth').classList.remove('hidden');
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('nav-guest').classList.remove('hidden');
        document.getElementById('nav-user').classList.add('hidden');
      }
    }

    function showAuthView(view) {
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      if (view === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      await supabaseClient.auth.signInWithPassword({ email, password });
    }

    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const metadata = {
        nombre: document.getElementById('reg-nombre').value,
        apellido: document.getElementById('reg-apellido').value,
        dni: document.getElementById('reg-dni').value,
        telefono: document.getElementById('reg-telefono').value,
        direccion: document.getElementById('reg-direccion').value,
        rol: document.getElementById('reg-rol').value
      };
      await supabaseClient.auth.signUp({ email, password, options: { data: metadata } });
    }

    async function loadProfile() {
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      if (data) {
        document.getElementById('profile-name').innerText = `${data.nombre} ${data.apellido}`;
        document.getElementById('profile-details').innerText = `DNI: ${data.dni} | Rol: ${data.rol.toUpperCase()}`;
      }
    }

    function recalculate() {
      const price = Number(document.getElementById('order-price').value) || 0;
      const ship = Number(document.getElementById('order-ship-cost').value) || 0;
      const totalBase = price + ship;
      const fee = totalBase * 0.03;
      document.getElementById('calc-fee').innerText = `$${fee.toFixed(2)}`;
      document.getElementById('calc-total').innerText = `$${(totalBase + fee).toFixed(2)}`;
    }

    // GENERAR ORDEN Y ABRIR CHECKOUT MERCADO PAGO
    async function handleCreateOrderAndPay(e) {
      e.preventDefault();
      const payBtn = document.getElementById('pay-btn');
      payBtn.disabled = true;
      payBtn.innerText = "Procesando Preferencia MP...";

      const title = document.getElementById('order-title').value;
      const price = Number(document.getElementById('order-price').value);
      const shipCost = Number(document.getElementById('order-ship-cost').value);
      const pin = Math.floor(100000 + Math.random() * 900000).toString();

      // 1. Guardar la orden pendiente en Supabase
      const { data: order, error } = await supabaseClient.from('orders').insert([{
        buyer_id: currentUser.id,
        item_title: title,
        item_price: price,
        commission_3pct: (price + shipCost) * 0.03,
        shipping_cost: shipCost,
        shipping_type: document.getElementById('order-ship-type').value,
        origin_address: document.getElementById('order-origin').value,
        destination_address: document.getElementById('order-destination').value,
        pin_code: pin,
        status: 'pendiente_pago'
      }]).select().single();

      if (error) {
        alert("Error al guardar la orden: " + error.message);
        payBtn.disabled = false;
        return;
      }

      // 2. Pedir a nuestra API la URL de Checkout de Mercado Pago
      try {
        const res = await fetch('/api/create-preference', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            order_id: order.id,
            title: title,
            price: price,
            shipping_cost: shipCost
          })
        });

        const data = await res.json();
        if (data.init_point) {
          // Redirigir al cliente a pagar en Mercado Pago
          window.location.href = data.init_point;
        } else {
          alert("Error de Mercado Pago: " + (data.error || "Falta configurar credenciales MP"));
          payBtn.disabled = false;
        }
      } catch (err) {
        alert("Error conectando con la pasarela: " + err.message);
        payBtn.disabled = false;
      }
    }

    async function loadOrders() {
      const { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('orders-list');
      if (!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Sin órdenes guardadas.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr class="hover:bg-slate-900/50">
          <td class="p-3"><div class="font-bold text-white">${o.item_title}</div><div class="text-[10px] text-slate-500">${o.shipping_type.toUpperCase()}</div></td>
          <td class="p-3 font-mono text-emerald-400">$${(o.item_price + o.shipping_cost + o.commission_3pct).toFixed(2)}</td>
          <td class="p-3 font-mono font-bold text-amber-400">${o.pin_code}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase">${o.status}</span></td>
          <td class="p-3 text-right">
            ${o.status === 'fondos_retendidos' ? `<button onclick="releaseFunds('${o.id}')" class="px-2 py-1 bg-emerald-500/20 text-emerald-300 rounded hover:bg-emerald-500/30">Liberar PIN</button>` : '-'}
          </td>
        </tr>
      `).join('');
    }

    async function releaseFunds(id) {
      const enteredPin = prompt("Ingrese el PIN de 6 dígitos entregado por el cliente:");
      if (!enteredPin) return;

      const { data: order } = await supabaseClient.from('orders').select('pin_code').eq('id', id).single();
      if (order && order.pin_code === enteredPin) {
        await supabaseClient.from('orders').update({ status: 'entregado_liberado' }).eq('id', id);
        alert("PIN Aceptado. Fondos liberados al Vendedor y Conductor.");
        loadOrders();
      } else {
        alert("PIN Incorrecto.");
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }
  </script>
</body>
  </html>
