<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escrow System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="border-b border-gray-800 pb-3 flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">🛡️ Escrow System Dashboard</h1>
      <button onclick="loadAll()" class="text-xs bg-gray-800 px-3 py-1 rounded text-gray-300">🔄 Actualizar</button>
    </div>

    <!-- CREAR TRANSACCIÓN -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
      <h2 class="text-sm font-semibold text-gray-200">➕ Crear Nueva Orden</h2>
      <div class="grid grid-cols-2 gap-2">
        <input id="buyer" placeholder="ID Comprador" class="bg-gray-800 p-2 text-xs rounded border border-gray-700 text-white outline-none">
        <input id="seller" placeholder="ID Vendedor" class="bg-gray-800 p-2 text-xs rounded border border-gray-700 text-white outline-none">
        <input id="amount" type="number" placeholder="Monto ($)" class="bg-gray-800 p-2 text-xs rounded border border-gray-700 text-white outline-none">
        <input id="desc" placeholder="Descripción" class="bg-gray-800 p-2 text-xs rounded border border-gray-700 text-white outline-none">
      </div>
      <button onclick="createTx()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 text-xs rounded font-bold text-white">Crear Orden</button>
    </div>

    <!-- TRANSACCIONES -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
      <h2 class="text-sm font-semibold text-gray-200">📋 Transacciones</h2>
      <div id="txList" class="space-y-2 text-xs">Cargando...</div>
    </div>

    <!-- DISPUTAS -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
      <h2 class="text-sm font-semibold text-amber-400">⚖️ Disputas</h2>
      <div id="disputeList" class="space-y-2 text-xs">Cargando...</div>
    </div>
  </div>

  <script>
    async function loadAll() { loadTx(); loadDisputes(); }

    async function loadTx() {
      const el = document.getElementById('txList');
      try {
        const r = await fetch('/api/escrow/all');
        const d = await r.json();
        if (!d.transactions || !d.transactions.length) {
          el.innerHTML = '<p class="text-gray-500">Sin transacciones.</p>';
          return;
        }
        el.innerHTML = d.transactions.map(t => {
          let btns = '';
          if (t.status === 'pending') btns += `<button onclick="pay('${t.id}')" class="bg-blue-600 px-2 py-1 rounded text-white mr-1">Acreditar Pago</button>`;
          if (t.status === 'funded') {
            btns += `<button onclick="complete('${t.id}')" class="bg-emerald-600 px-2 py-1 rounded text-white mr-1">Liberar Fondos</button>`;
            btns += `<button onclick="dispute('${t.id}', '${t.buyer_id}')" class="bg-rose-600 px-2 py-1 rounded text-white">Reclamar</button>`;
          }
          return `<div class="bg-gray-950 p-3 rounded border border-gray-800 flex justify-between items-center">
            <div>
              <p class="font-bold text-gray-200">${t.description || 'Sin descripción'} <span class="text-emerald-400">$${t.amount}</span></p>
              <p class="text-gray-500">Estado: <strong class="text-gray-300">${t.status.toUpperCase()}</strong> | C: ${t.buyer_id} | V: ${t.seller_id}</p>
            </div>
            <div>${btns}</div>
          </div>`;
        }).join('');
      } catch (e) { el.innerHTML = 'Error al cargar.'; }
    }

    async function loadDisputes() {
      const el = document.getElementById('disputeList');
      try {
        const r = await fetch('/api/escrow/disputes/all');
        const d = await r.json();
        if (!d.disputes || !d.disputes.length) {
          el.innerHTML = '<p class="text-gray-500">Sin disputas.</p>';
          return;
        }
        el.innerHTML = d.disputes.map(dp => {
          let btns = '';
          if (dp.status === 'open') {
            btns = `<button onclick="resolve('${dp.id}', '${dp.transaction_id}', 'buyer')" class="bg-rose-600 px-2 py-1 rounded text-white mr-1">Reembolsar Comprador</button>` +
                   `<button onclick="resolve('${dp.id}', '${dp.transaction_id}', 'seller')" class="bg-emerald-600 px-2 py-1 rounded text-white">Pagar Vendedor</button>`;
          } else {
            btns = `<span class="text-emerald-400">Ganador: ${dp.winner_role}</span>`;
          }
          return `<div class="bg-gray-950 p-3 rounded border border-amber-900/40 flex justify-between items-center">
            <div><p class="font-bold text-amber-300">${dp.reason}</p><p class="text-gray-500">Por: ${dp.opened_by}</p></div>
            <div>${btns}</div>
          </div>`;
        }).join('');
      } catch (e) { el.innerHTML = 'Error al cargar disputas.'; }
    }

    async function createTx() {
      const b = document.getElementById('buyer').value;
      const s = document.getElementById('seller').value;
      const a = document.getElementById('amount').value;
      const d = document.getElementById('desc').value;
      if (!b || !s || !a) return alert('Campos incompletos');
      await fetch('/api/escrow/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ buyer_id: b, seller_id: s, amount: a, description: d })
      });
      loadAll();
    }

    async function pay(id) {
      await fetch('/api/webhooks/payment', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ transaction_id: id, payment_status: 'approved' })
      });
      loadAll();
    }

    async function complete(id) {
      await fetch('/api/escrow/status', {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ transaction_id: id, status: 'completed' })
      });
      loadAll();
    }

    async function dispute(id, buyerId) {
      const reason = prompt('Motivo del reclamo:');
      if (!reason) return;
      await fetch('/api/escrow/dispute/open', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ transaction_id: id, opened_by: buyerId, reason: reason })
      });
      loadAll();
    }

    async function resolve(disputeId, txId, winner) {
      await fetch('/api/escrow/dispute/resolve', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ dispute_id: disputeId, transaction_id: txId, winner_role: winner, resolution_notes: 'Resuelto por admin' })
      });
      loadAll();
    }

    loadAll();
  </script>
</body>
  </html>
